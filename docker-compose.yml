# compose individual do frontend — espelha o serviço frontend do compose central
# (PI2-2026-2-equipe-03).
name: pi2-frontend

services:
  frontend:
    build:
      context: .
    container_name: tagravado-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # alvo do proxy /api do vite (ver vite.config.ts). o padrão alcança o backend
      # publicado no host, em Docker ou nativo; na pi2-net também vale http://backend:3000.
      API_PROXY_TARGET: ${API_PROXY_TARGET:-http://host.docker.internal:3000}
      # sem valor: repassa do .env só se estiver definida; senão, vale o .env.local.
      VITE_API_URL:
      VITE_USE_MOCKS:
      VITE_APP_ENV:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - /app/node_modules
    networks:
      - pi2-net

networks:
  pi2-net:
    name: pi2-net
    driver: bridge
