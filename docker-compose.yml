services:
  frontend:
    build: .
    container_name: pi2-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - API_PROXY_TARGET=http://host.docker.internal:3000
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: npm run dev
